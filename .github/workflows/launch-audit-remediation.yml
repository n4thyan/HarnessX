name: Launch HarnessX audit remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged remediation to branch
        shell: bash
        run: |
          git fetch origin audit-remediation:audit-remediation
          git checkout audit-remediation
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re
          import subprocess

          workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  "270750059f08ec32c923ad49e570e5792c1982b4:.github/workflows/apply-audit-runtime.yml",
              ],
              text=True,
          )
          match = re.search(r"echo '([^']+)' \| base64 -d", workflow)
          if match is None:
              raise SystemExit("immutable remediation payload not found")

          payload = gzip.decompress(base64.b64decode(match.group(1))).decode("utf-8")
          payload = payload.replace(
              "re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)",
          )
          Path("/tmp/apply_audit_runtime.py").write_text(payload, encoding="utf-8")
          PY
          python /tmp/apply_audit_runtime.py
          python -m compileall -q server
          python -m json.tool config.json >/dev/null
          grep -q 'DEFAULT_BRIDGE_TOKEN' server/main.py
          grep -q 'browser_origins_forbidden' server/main.py
          grep -q 'set_interval_ms' server/scanner.py
          grep -q 'MAX_PENDING_EVENTS' roblox/Core.lua
          grep -q 'remoteDurationMs' roblox/SUNC.lua
          grep -q '_G.HarnessXRemotes' roblox/Fuzzer.client.lua
          test ! -e EXECUTOR_BUILD.md
          rm -f .github/workflows/apply-audit-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden HarnessX runtime and bridge"
          git push origin HEAD:audit-remediation
