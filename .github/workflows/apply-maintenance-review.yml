name: Apply HarnessX maintenance review

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-maintenance-review.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply maintenance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def regex_replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return updated

          core_path = Path("roblox/Core.lua")
          core = core_path.read_text(encoding="utf-8")
          core = replace_once(
              core,
              'local BRIDGE_URL = "http://127.0.0.1:8765"\nlocal BRIDGE_TOKEN = "change-this-local-token-please"\nlocal MAX_DEPTH = 6\n',
              '''local BRIDGE_URL = "http://127.0.0.1:8765"
          local bridgeTokenAttribute = game:GetAttribute("HarnessXBridgeToken")

          if typeof(bridgeTokenAttribute) ~= "string" or #bridgeTokenAttribute < 16 then
          \twarn(
          \t\t"HarnessX stopped: set the HarnessXBridgeToken game attribute "
          \t\t\t.. "to the same value as config.json bridge.token."
          \t)
          \treturn nil
          end

          local BRIDGE_TOKEN = bridgeTokenAttribute :: string
          local MAX_DEPTH = 6
          ''',
              "Core bridge token",
          )
          core_path.write_text(core, encoding="utf-8", newline="\n")

          plugin_path = Path("roblox/Plugin.lua")
          plugin = plugin_path.read_text(encoding="utf-8")
          plugin = replace_once(
              plugin,
              'local URL = "http://127.0.0.1:8765"\nlocal TOKEN = "change-this-local-token-please"\nlocal HEADER = "-- <HarnessX:instrumented>"\n',
              '''local URL = "http://127.0.0.1:8765"
          local tokenAttribute = game:GetAttribute("HarnessXBridgeToken")

          if typeof(tokenAttribute) ~= "string" or #tokenAttribute < 16 then
          \twarn(
          \t\t"HarnessX plugin stopped: set the HarnessXBridgeToken game attribute "
          \t\t\t.. "to the same value as config.json bridge.token."
          \t)
          \treturn nil
          end

          local TOKEN = tokenAttribute :: string
          local HEADER = "-- <HarnessX:instrumented>"
          ''',
              "Plugin bridge token",
          )
          plugin_path.write_text(plugin, encoding="utf-8", newline="\n")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              '''The same token must appear in:

          ```text
          config.json
          roblox/Core.lua
          roblox/Plugin.lua
          ```
          ''',
              '''Set a local bridge token of at least 16 characters in `config.json`:

          ```json
          "bridge": {
            "token": "replace-with-a-long-local-token"
          }
          ```

          Then set the same value once as a Studio DataModel attribute, for example from the Command Bar:

          ```lua
          game:SetAttribute("HarnessXBridgeToken", "replace-with-a-long-local-token")
          ```

          `Core.lua` and `Plugin.lua` read this shared attribute, so separate token literals are no longer embedded in those files. The authenticated `/v1/config` route cannot supply its own authentication token because a caller already needs the token to access that route.
          ''',
              "README token instructions",
          )

          if "## License\n" not in readme:
              marker = "\n## Studio-only execution\n"
              if marker not in readme:
                  raise SystemExit("README Studio-only marker missing")
              readme = readme.replace(
                  marker,
                  '''
          ## License

          HarnessX is licensed under the MIT License. See [`LICENSE`](LICENSE).
          ''' + marker,
                  1,
              )

          readme_path.write_text(readme, encoding="utf-8", newline="\n")

          remote_doc_path = Path("docs/REMOTE_PROXY.md")
          remote_doc = remote_doc_path.read_text(encoding="utf-8")
          remote_doc = regex_replace_once(
              remote_doc,
              r'## Branch safety state\n\n.*?\n## Installation',
              '''## Runtime safety

          HarnessX remains Studio-only. Runtime modules begin with both checks:

          ```lua
          if not game:GetService("RunService"):IsStudio() then return nil end
          if game:GetAttribute("HarnessXEnabled") ~= true then return nil end
          ```

          `HarnessXEnabled` is an additional opt-in switch inside Studio; it does not bypass the Studio guard.

          Enable it before requiring HarnessX runtime modules:

          ```lua
          game:SetAttribute("HarnessXEnabled", true)
          ```

          ## Installation''',
              "RemoteProxy safety section",
          )
          remote_doc = regex_replace_once(
              remote_doc,
              r'## AutoProxy status\n\n.*?\n## Studio-only execution',
              '''## AutoProxy

          `roblox/AutoProxy.lua` is included in the repository. It scans a selected folder and its descendants, builds a matching Luau table hierarchy, and wraps eligible `RemoteEvent` and `RemoteFunction` leaves through the existing `RemoteProxy` module.

          ```lua
          local ReplicatedStorage = game:GetService("ReplicatedStorage")
          local HarnessX = ReplicatedStorage:WaitForChild("HarnessX")
          local AutoProxy = require(HarnessX:WaitForChild("AutoProxy"))

          local remotes = AutoProxy.wrapFolder(
              ReplicatedStorage:WaitForChild("Remotes")
          )

          remotes.Purchase:FireServer("Sword", 1)
          local inventory = remotes.Api.GetInventory:InvokeServer()
          ```

          `AutoProxy.wrapFolder()` respects `HarnessXIgnore` on the root, ancestors, and remotes. It calls `RemoteProxy.wrap()`, so repeated wrapping reuses the existing RemoteProxy cache. The hierarchy is a snapshot of remotes present when called; call it again after changing the folder structure.

          ## Studio-only execution''',
              "RemoteProxy AutoProxy section",
          )
          remote_doc_path.write_text(remote_doc, encoding="utf-8", newline="\n")

          status = """# Current HarnessX baseline

          HarnessX is populated and usable as a Studio-only debugging and testing baseline.

          ## Included in the current Studio plugin

          - Dockable HarnessX dashboard
          - Authenticated live-traffic polling
          - Script inspector
          - Source instrumentation through `ScriptEditorService:UpdateSourceAsync()`
          - Configurable `UNC` or `RemoteProxy` rewrite style
          - Undo-aware batch rewrites
          - Observe/mock and performance-profile controls
          - Source backup controls
          - Trace injection
          - Remote discovery and fuzz-session controls

          ## Runtime and bridge capabilities

          `roblox/Core.lua`, the proxy modules, and `server/main.py` provide:

          - Manual `RemoteProxy` wrappers
          - Folder hierarchy generation through `AutoProxy`
          - Cooperative stack snapshots
          - Server-Sent Events traffic streaming
          - Safe process metrics
          - Instance, GC, and harness-owned connection diagnostics
          - Rolling RemoteFunction latency statistics
          - Timestamped source backups
          - Fuzz-session coordination and reporting

          The current compact plugin consumes traffic through authenticated polling. The bridge also retains SSE and stack-dump APIs, but the present plugin does not consume those endpoints.

          ## Security boundary

          All Luau entry points remain guarded by `RunService:IsStudio()` and the `HarnessXEnabled` opt-in attribute. The Flask bridge remains loopback-only and token-authenticated. Process-memory reads and writes are not supported.

          ## Validation boundary

          Python syntax and encoder tests were run against the generated source before publication. Repository checks confirm the configuration, Studio guards, runtime files, Flask bridge, documentation, and plugin source. A Roblox Studio playtest is still required for Luau runtime behavior and DockWidget rendering verification.
          """
          Path("CURRENT_STATUS.md").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in status.splitlines()) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          def dedent_block(value: str) -> str:
              return "\n".join(line[10:] if line.startswith("          ") else line for line in value.splitlines()) + "\n"

          Path("LICENSE").write_text(dedent_block("""MIT License

          Copyright (c) 2026 n4thyan

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          """), encoding="utf-8", newline="\n")

          issue_dir = Path(".github/ISSUE_TEMPLATE")
          issue_dir.mkdir(parents=True, exist_ok=True)
          (issue_dir / "bug_report.md").write_text(dedent_block("""---
          name: Bug report
          about: Report a reproducible HarnessX problem
          title: "[Bug] "
          labels: bug
          assignees: ""
          ---

          ## Summary

          Describe the problem clearly.

          ## Reproduction

          1.
          2.
          3.

          ## Expected behavior

          What should have happened?

          ## Actual behavior

          What happened instead?

          ## Environment

          - Operating system:
          - Roblox Studio version:
          - HarnessX commit:
          - Active profile:
          - Wrapper style (`UNC` or `RemoteProxy`):

          ## Logs or screenshots

          Remove tokens and private values before posting logs.

          ## Checklist

          - [ ] This occurs inside Roblox Studio.
          - [ ] `HarnessXEnabled` is set to `true`.
          - [ ] `HarnessXBridgeToken` matches `config.json`.
          - [ ] I checked for `HarnessXIgnore` on the relevant instances.
          """), encoding="utf-8", newline="\n")

          (issue_dir / "feature_request.md").write_text(dedent_block("""---
          name: Feature request
          about: Suggest a supported Studio debugging improvement
          title: "[Feature] "
          labels: enhancement
          assignees: ""
          ---

          ## Problem

          What Studio debugging or testing problem should this solve?

          ## Proposed behavior

          Describe the expected workflow and API.

          ## Alternatives considered

          Describe any source-instrumentation, wrapper, plugin, or bridge alternatives.

          ## Safety boundary

          Confirm that the proposal uses supported Roblox Studio APIs and does not require executor APIs, engine metamethod hooks, process-memory access, or live-client exploitation techniques.
          """), encoding="utf-8", newline="\n")

          Path(".github/PULL_REQUEST_TEMPLATE.md").write_text(dedent_block("""## Summary

          Describe the change and why it is needed.

          ## Files changed

          List the important files and behavior affected.

          ## Validation

          - [ ] Python syntax/tests pass where applicable.
          - [ ] Luau files retain the Studio and `HarnessXEnabled` guards.
          - [ ] The bridge remains bound to `127.0.0.1`.
          - [ ] `/v1/*` routes remain token-authenticated.
          - [ ] No process-memory access or unsupported engine hooks were added.
          - [ ] Roblox Studio playtest results are included, or the lack of playtest validation is stated.

          ## Documentation

          - [ ] README or focused documentation was updated.
          - [ ] Tokens, private paths, and personal information were removed from logs and screenshots.
          """), encoding="utf-8", newline="\n")

          json.loads(Path("config.json").read_text(encoding="utf-8"))
          assert 'change-this-local-token-please' not in core
          assert 'change-this-local-token-please' not in plugin
          assert 'game:GetAttribute("HarnessXBridgeToken")' in core
          assert 'game:GetAttribute("HarnessXBridgeToken")' in plugin
          assert '`roblox/AutoProxy.lua` is included' in remote_doc
          assert 'present plugin does not consume those endpoints' in Path("CURRENT_STATUS.md").read_text(encoding="utf-8")
          assert Path("LICENSE").is_file()
          assert (issue_dir / "bug_report.md").is_file()
          assert (issue_dir / "feature_request.md").is_file()
          assert Path(".github/PULL_REQUEST_TEMPLATE.md").is_file()
          PY

      - name: Commit maintenance fixes
        shell: bash
        run: |
          rm -f .github/workflows/apply-maintenance-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve repository maintenance review"
          git push origin HEAD:main
