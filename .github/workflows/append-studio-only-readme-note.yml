name: Append HarnessX Studio-only notice

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/append-studio-only-readme-note.yml"

permissions:
  contents: write

jobs:
  update-readmes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Append Studio-only notice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          section = '''

## Studio-only execution

HarnessX remains Studio-only.

The `HarnessXEnabled` attribute is an additional opt-in gate inside Studio. It does not bypass `RunService:IsStudio()`.

Running HarnessX in a published live client is not supported out of the box. To run it in a live client, you would need to maintain a separate unsupported fork with the Studio guards manually removed from the Luau files. This configuration is not tested, recommended, or supported by the HarnessX project.
'''

          for filename in ("README.md", "docs/REMOTE_PROXY.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8").rstrip()
              if "## Studio-only execution" not in text:
                  path.write_text(text + section + "\n", encoding="utf-8", newline="\n")
          PY

      - name: Commit documentation update
        shell: bash
        run: |
          rm -f .github/workflows/append-studio-only-readme-note.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/REMOTE_PROXY.md .github/workflows/append-studio-only-readme-note.yml
          git commit -m "Document Studio-only execution"
          git push origin HEAD:main
