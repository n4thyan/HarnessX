name: Apply HarnessX audit runtime remediation

on:
  push:
    branches:
      - audit-remediation
    paths:
      - ".github/workflows/apply-audit-runtime.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-remediation

      - name: Apply runtime and bridge remediation
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_audit_runtime.py
          python /tmp/apply_audit_runtime.py

      - name: Validate generated runtime changes
        shell: bash
        run: |
          python -m compileall -q server
          python -m json.tool config.json >/dev/null
          grep -q 'DEFAULT_BRIDGE_TOKEN' server/main.py
          grep -q 'browser_origins_forbidden' server/main.py
          grep -q 'set_interval_ms' server/scanner.py
          grep -q 'MAX_PENDING_EVENTS' roblox/Core.lua
          grep -q 'remoteDurationMs' roblox/SUNC.lua
          grep -q '_G.HarnessXRemotes' roblox/Fuzzer.client.lua
          test ! -e EXECUTOR_BUILD.md

      - name: Commit runtime remediation
        shell: bash
        run: |
          rm -f .github/workflows/apply-audit-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden HarnessX runtime and bridge"
          git push origin HEAD:audit-remediation
