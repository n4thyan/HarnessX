name: Apply HarnessX proxy upgrade

on:
  push:
    branches:
      - global-hooks
    paths:
      - ".github/workflows/apply-harnessx-upgrade.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-hooks

      - name: Patch Core and Plugin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          plugin_path = Path("roblox/Plugin.lua")
          plugin = plugin_path.read_text(encoding="utf-8")

          plugin = replace_once(
              plugin,
              'if not game:GetService("RunService"):IsStudio() then return nil end\n\nassert(plugin, "Plugin.lua must run as a Roblox Studio plugin")',
              'if not game:GetService("RunService"):IsStudio() then return nil end\nif game:GetAttribute("HarnessXEnabled") ~= true then return nil end\n\nassert(plugin, "Plugin.lua must run as a Roblox Studio plugin")',
              "Plugin guard",
          )

          plugin = replace_once(
              plugin,
              'local excludeAttribute = tostring(pluginConfig.exclude_scripts_with_attribute or IGNORE_ATTRIBUTE)\n',
              '''local excludeAttribute = tostring(pluginConfig.exclude_scripts_with_attribute or IGNORE_ATTRIBUTE)
          local wrapperStyle = if string.lower(tostring(pluginConfig.wrapper_style or "UNC")) == "remoteproxy"
          \tthen "RemoteProxy"
          \telse "UNC"
          ''',
              "Plugin wrapper style",
          )

          plugin = replace_once(
              plugin,
              '''\t\tlocal wrapper = if bestMethod == "FireServer" then "UNC.FireServer" else "SUNC.InvokeServer"
          \t\tlocal replacement = wrapper .. "(" .. receiver .. (if afterOpen then "" else ", ")
          ''',
              '''\t\tlocal replacement: string
          \t\tif wrapperStyle == "RemoteProxy" then
          \t\t\treplacement = "__rp.wrap(" .. receiver .. "):" .. bestMethod .. "("
          \t\telse
          \t\t\tlocal wrapper = if bestMethod == "FireServer" then "UNC.FireServer" else "SUNC.InvokeServer"
          \t\t\treplacement = wrapper .. "(" .. receiver .. (if afterOpen then "" else ", ")
          \t\tend
          ''',
              "Plugin rewrite expression",
          )

          old_header = '''\tif count > 0 and not rewritten:find(HEADER, 1, true) then
          \t\tlocal header = table.concat({
          \t\t\tHEADER,
          \t\t\t'local ReplicatedStorage = game:GetService("ReplicatedStorage")',
          \t\t\t'local __HarnessX = ReplicatedStorage:WaitForChild("HarnessX")',
          \t\t\t'local UNC = require(__HarnessX:WaitForChild("UNC"))',
          \t\t\t'local SUNC = require(__HarnessX:WaitForChild("SUNC"))',
          \t\t\t"-- </HarnessX:instrumented>",
          \t\t\t"",
          \t\t}, "\\n")
          \t\trewritten = header .. rewritten
          \tend
          '''
          new_header = '''\tif count > 0 then
          \t\tif wrapperStyle == "RemoteProxy" then
          \t\t\tlocal requireLine = 'local __rp = require(game.ReplicatedStorage.HarnessX.RemoteProxy)'
          \t\t\tif not rewritten:find(requireLine, 1, true) then
          \t\t\t\tif rewritten:find(HEADER, 1, true) then
          \t\t\t\t\trewritten = rewritten:gsub(HEADER, HEADER .. "\\n" .. requireLine, 1)
          \t\t\t\telse
          \t\t\t\t\tlocal header = table.concat({
          \t\t\t\t\t\tHEADER,
          \t\t\t\t\t\trequireLine,
          \t\t\t\t\t\t"-- </HarnessX:instrumented>",
          \t\t\t\t\t\t"",
          \t\t\t\t\t}, "\\n")
          \t\t\t\t\trewritten = header .. rewritten
          \t\t\t\tend
          \t\t\tend
          \t\telseif not rewritten:find(HEADER, 1, true) then
          \t\t\tlocal header = table.concat({
          \t\t\t\tHEADER,
          \t\t\t\t'local ReplicatedStorage = game:GetService("ReplicatedStorage")',
          \t\t\t\t'local __HarnessX = ReplicatedStorage:WaitForChild("HarnessX")',
          \t\t\t\t'local UNC = require(__HarnessX:WaitForChild("UNC"))',
          \t\t\t\t'local SUNC = require(__HarnessX:WaitForChild("SUNC"))',
          \t\t\t\t"-- </HarnessX:instrumented>",
          \t\t\t\t"",
          \t\t\t}, "\\n")
          \t\t\trewritten = header .. rewritten
          \t\tend
          \tend
          '''
          plugin = replace_once(plugin, old_header, new_header, "Plugin header injection")

          plugin = replace_once(
              plugin,
              '''\t\t\tlocal _, unc = source:gsub("UNC%.FireServer%(", "")
          \t\t\tlocal _, sunc = source:gsub("SUNC%.InvokeServer%(", "")
          \t\t\tcount = unc + sunc
          ''',
              '''\t\t\tlocal _, unc = source:gsub("UNC%.FireServer%(", "")
          \t\t\tlocal _, sunc = source:gsub("SUNC%.InvokeServer%(", "")
          \t\t\tlocal _, remoteProxy = source:gsub("__rp%.wrap%(", "")
          \t\t\tcount = unc + sunc + remoteProxy
          ''',
              "Plugin inspector count",
          )

          plugin_path.write_text(plugin, encoding="utf-8", newline="\n")

          core_path = Path("roblox/Core.lua")
          core = core_path.read_text(encoding="utf-8")
          core_marker = '''local getPerformanceStats = ensureChild(
          \ttransportFolder,
          \t"BindableFunction",
          \t"GetPerformanceStats"
          ) :: BindableFunction

          local function httpRequest'''
          quick_start = '''local getPerformanceStats = ensureChild(
          \ttransportFolder,
          \t"BindableFunction",
          \t"GetPerformanceStats"
          ) :: BindableFunction

          local function initializeAutoProxyQuickStart()
          \tlocal remotesFolder = ReplicatedStorage:FindFirstChild("Remotes")
          \tif remotesFolder == nil then
          \t\treturn
          \tend

          \tlocal autoProxyModule = packageFolder:FindFirstChild("AutoProxy")
          \tif autoProxyModule == nil or not autoProxyModule:IsA("ModuleScript") then
          \t\twarn("HarnessX quick start skipped: ReplicatedStorage.HarnessX.AutoProxy is missing.")
          \t\treturn
          \tend

          \tlocal requireOk, AutoProxy = pcall(require, autoProxyModule)
          \tif not requireOk or typeof(AutoProxy) ~= "table" then
          \t\twarn("HarnessX quick start failed to load AutoProxy: " .. tostring(AutoProxy))
          \t\treturn
          \tend

          \tlocal wrapOk, wrapped = pcall(AutoProxy.wrapFolder, remotesFolder)
          \tif not wrapOk then
          \t\twarn("HarnessX quick start failed to wrap ReplicatedStorage.Remotes: " .. tostring(wrapped))
          \t\treturn
          \tend

          \t-- _G is scoped to this Luau VM. Core normally runs on the server, so
          \t-- client code that needs FireServer/InvokeServer proxies should call
          \t-- AutoProxy.wrapFolder() from its own LocalScript VM.
          \t_G.HarnessXRemotes = wrapped
          \tprint("HarnessX quick start: _G.HarnessXRemotes is ready.")
          end

          task.defer(initializeAutoProxyQuickStart)

          local function httpRequest'''
          core = replace_once(core, core_marker, quick_start, "Core AutoProxy quick start")
          core_path.write_text(core, encoding="utf-8", newline="\n")

          import shutil
          shutil.rmtree(".harnessx-upgrade", ignore_errors=True)

          assert plugin.startswith('if not game:GetService("RunService"):IsStudio() then return nil end\nif game:GetAttribute("HarnessXEnabled") ~= true then return nil end\n')
          assert 'local __rp = require(game.ReplicatedStorage.HarnessX.RemoteProxy)' in plugin
          assert 'replacement = "__rp.wrap(" .. receiver .. "):" .. bestMethod .. "("' in plugin
          assert '_G.HarnessXRemotes = wrapped' in core
          PY

      - name: Commit generated replacements
        shell: bash
        run: |
          rm -f .github/workflows/apply-harnessx-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add AutoProxy and configurable wrapper style"
          git push origin HEAD:global-hooks
